# wrangler.toml — prompt-pack storefront bot (Cloudflare Worker)
# ---------------------------------------------------------------------------
# NO SECRETS IN THIS FILE. Ever. Secrets are set with `wrangler secret put`
# (see README.md) and reach the Worker only as encrypted environment
# variables. This file is safe to commit to a public GitHub repo.
# ---------------------------------------------------------------------------

name = "prompt-pack-bot"
main = "src/worker.js"
compatibility_date = "2026-11-20"

# Free plan: 100,000 requests/day. This bot uses ~1 request per Telegram
# update + 1 TonAPI call per cron sweep. Nothing here comes close to the cap.

# --- Non-secret configuration (public values only) --------------------------
[vars]
PRODUCT_PRICE_USDT = "2.00"      # price in USDT; change here to reprice
ORDER_TTL_MINUTES = "60"         # order expiry; late payments go to manual review
TON_PRICE_USD = "1.00"           # fallback TON/USD rate if TonAPI rates is down
SUPPORT_USERNAME = ""            # seller's public Telegram @ (no @), e.g. "halakouai_byte"
BOT_USERNAME = ""                # bot @ (no @), e.g. "promptpack_bot" — used for landing-page claim links

# --- KV: order records, tx-hash dedup, rate-limit state ---------------------
# Create it once, then paste the id below:
#   wrangler kv namespace create ORDERS_KV
#   wrangler kv namespace create ORDERS_KV --preview
[[kv_namespaces]]
binding = "ORDERS_KV"
id = "136d3d601e18407dafbf137e208f89b3"
preview_id = "34daadf63f214ceb95f1383fa88880e0"

# --- Cron: payment sweep every 2 minutes ------------------------------------
# Free plan allows 5 cron triggers; this uses 1. Each sweep makes ONE TonAPI
# call + ONE TON Center call and matches them locally against all pending
# orders (never one API call per order).
[triggers]
crons = ["*/2 * * * *"]
