name: Deploy landing page to Cloudflare Pages

# Least privilege: this workflow only reads the repo. deployments: write is
# needed because cloudflare/pages-action creates a GitHub deployment for
# each Pages deploy; contents: read alone would break it (403).
permissions:
  contents: read
  deployments: write

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy-pages.yml"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: telegram-channel-prompt-pack
          directory: site
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
