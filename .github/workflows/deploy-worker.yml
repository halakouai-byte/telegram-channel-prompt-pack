name: Deploy Worker to Cloudflare

# Least privilege: this workflow only reads the repo; the deploy itself
# authenticates to Cloudflare with the CLOUDFLARE_API_TOKEN secret.
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          # Secrets (BOT_TOKEN, SELLER_TON_ADDRESS, PRODUCT_FILE_ID, ...) are set
          # with `wrangler secret put` — never in this repo or workflow.
